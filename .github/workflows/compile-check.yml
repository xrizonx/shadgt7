name: Renderer PR compile check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-compile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  renderer:
    name: Compile renderer host libraries
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Support long submodule paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Compile PR merge checkout
        shell: pwsh
        run: ./.github/scripts/compile-renderer.ps1
      - name: Package eight renderer libraries for ryGT7
        shell: pwsh
        run: ./.github/scripts/package-renderer.ps1 -BuildRoot Build/pr-compile -OutputRoot Build/rygt7-renderer-artifact
      - name: Upload downloadable renderer ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rygt7-renderer-modules-${{ github.event.pull_request.head.sha }}
          path: |
            Build/rygt7-renderer-artifact/*.zip
            Build/rygt7-renderer-artifact/*.zip.sha256
          if-no-files-found: error
          retention-days: 7
